<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku – Select Level</title>

  <!-- Glass + Jelly Styles -->
  <link rel="stylesheet" href="levelPage.css" />
</head>

<body>

  <div class="level-glass">
    <h2>Select Difficulty</h2>

    <button class="level-btn easy" onclick="setLevel('board1')">
      Easy
    </button>

    <button class="level-btn medium" onclick="setLevel('board2')">
      Medium
    </button>

    <button class="level-btn hard" onclick="setLevel('board3')">
      Hard
    </button>
  </div>

  <script src="levelPage.js"></script>
</body>
</html>
